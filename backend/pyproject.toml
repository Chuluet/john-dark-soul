[project]
name = "backend"
version = "0.1.0"
description = "API FastAPI y agente RAG (LangGraph + Ollama + pgvector) sobre el lore de Dark Souls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av<14",
    "beautifulsoup4>=4.15.0",
    "docx2txt>=0.9",
    "fastapi>=0.143.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.11",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "mwparserfromhell>=0.7.2",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
