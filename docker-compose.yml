services:
  db:
    image: pgvector/pgvector:pg17
    container_name: darksoul-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: darksoul-ollama
    ports:
      - "11434:11434"
    environment:
      # Mantiene el modelo cargado en memoria entre preguntas (evita recargarlo cada vez).
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      # Los modelos pesan varios GB: el volumen evita volver a descargarlos.
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: darksoul-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Dentro de Docker se usan los nombres de los servicios, no localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - db
      - ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama-models:
